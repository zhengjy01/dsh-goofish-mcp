# dsh-xianyu bundle patch: inserts the plugin row into the profile
# roster. Applied as a profile bundle layer (declared by the `dsh.bundle.patch`
# manifest field in package.json). Activate with:
#
#   dsh plugin --profile web add link:/path/to/dsh-goofish-mcp
#
# The plugin is mounted automatically when `dsh-goofish-mcp` is listed in the
# profile's `dsh.profile.bundles`.
- insert:
    - id: goofish-mcp
      name: dsh-goofish-mcp
      config:
        announceToAgent: true   # 在系统提示中公告插件（工具 + 能力说明）
        enabled: true           # 插件总开关
        readOnly: true          # 只注册只读工具（过滤发布/删除/发消息/auth_login 等写操作）
